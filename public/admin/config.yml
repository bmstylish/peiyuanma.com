site_url: https://peiyuanma.com

backend:
  name: github
  repo: bmstylish/peiyuanma.com
  branch: main
  base_url: https://decap-auth.peiyuanma.com
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "{{media_folder}}/blog/{{slug}}"
    public_folder: "{{public_folder}}/blog/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Category", name: "category", widget: "select", options: [{ label: "Site Building", value: "site-building" }, { label: "Homelab", value: "homelab" }, { label: "Project Notes", value: "project-notes" }, { label: "Learning Journal", value: "learning-journal" }] }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "writeupSources"
    label: "Writeup Sources"
    label_singular: "Writeup Source"
    folder: "src/content/writeup-sources"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "name"
    preview_path: "writeups/{{slug}}"
    sortable_fields: ["order", "name", "type"]
    summary: "{{name}} — {{type}}"
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Examples: picoCTF, Hack The Box, BSides Las Vegas 2027" }
      - label: "Source Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Challenge Platform", value: "platform" }
          - { label: "Event / Conference", value: "event" }
          - { label: "Independent Lab", value: "independent" }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", min: 0, default: 0 }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
  - name: "labs"
    label: "Challenge Writeups"
    label_singular: "Challenge Writeup"
    folder: "src/content/labs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "{{media_folder}}/writeups/{{slug}}"
    public_folder: "{{public_folder}}/writeups/{{slug}}"
    preview_path: "writeups/{{source}}/{{slug}}"
    sortable_fields: ["source", "date", "status", "title"]
    summary: "{{source}} — {{title}} ({{status}})"
    fields:
      - label: "Source"
        name: "source"
        widget: "relation"
        collection: "writeupSources"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        hint: "Choose the platform, event, conference, or independent lab this challenge came from."
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Difficulty", name: "difficulty", widget: "select", options: ["beginner", "intermediate", "advanced"] }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Status", name: "status", widget: "select", options: ["planned", "in-progress", "complete"] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "{{media_folder}}/projects/{{slug}}"
    public_folder: "{{public_folder}}/projects/{{slug}}"
    sortable_fields: ["date", "order", "title", "status"]
    summary: "{{date}} — {{title}} — {{status}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "GitHub URL", name: "github", widget: "string", required: false }
      - { label: "Demo URL", name: "demo", widget: "string", required: false }
      - { label: "Status", name: "status", widget: "select", options: ["planned", "active", "complete", "archived"], default: "planned" }
      - { label: "Lessons", name: "lessons", widget: "text", required: false }
      - { label: "Project Write-up", name: "writeup", widget: "boolean", default: false }
      - { label: "Journal ID", name: "journal", widget: "string", required: false, hint: "Connects this project to a daily journal." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", min: 0, default: 0 }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
  - name: "ctfDays"
    label: "Pentesting Daily Journal"
    label_singular: "Pentesting Day"
    folder: "src/content/ctf-days"
    create: true
    slug: "day-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "{{media_folder}}/journal/{{slug}}"
    public_folder: "{{public_folder}}/journal/{{slug}}"
    sortable_fields: ["day", "status", "title"]
    summary: "Day {{day}} — {{title}} ({{status}})"
    fields:
      - { label: "Project ID", name: "project", widget: "string", default: "ctf-winter-break-2026" }
      - { label: "Day", name: "day", widget: "number", value_type: "int", min: 1 }
      - { label: "Week", name: "week", widget: "number", value_type: "int", min: 1 }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Plan", name: "description", widget: "text" }
      - { label: "Status", name: "status", widget: "select", options: ["planned", "in-progress", "complete"], default: "planned" }
      - { label: "Completed Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Daily Notes", name: "body", widget: "markdown" }
